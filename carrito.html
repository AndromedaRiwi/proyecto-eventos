<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Canasta | FoodMaster</title>
    <link rel="icon" href="/proyecto-eventos/img/logos/logo_FoodMaster.png" type="image/x-icon">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos -->
    <link rel="stylesheet" href="/proyecto-eventos/css_index/carrito.css">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <!-- ENCABEZADO -->
    <div class="top-bar">
        <img src="/proyecto-eventos/img/logos/logo_FoodMaster.png" width="200" alt="Logo de FoodMaster">
    </div>
    <div class="center-title">
        ¡TU CANASTA!
    </div>
    <!-- FORMULARIO PRINCIPAL -->
    <div class="form-box">
        <div class="form-content">
            <label>INGRESA TU DIRECCIÓN:</label>
            <input type="text" placeholder="Dirección">

            <label>CASA/EDIFICIO/OFICINA:</label>
            <input type="text" placeholder="Piso">

            <div class="row">
                <div class="col-md-6">
                    <label>PRODUCTO:</label>
                    <input type="text" placeholder="Ej: burguermaster">
                </div>
                <div class="col-md-6">
                    <label>CANTIDAD:</label>
                    <input type="number" placeholder="Valor numerico">
                </div>
            </div>

            <div class="d-flex align-items-center mt-3">
                <i class="fa-solid fa-cart-shopping cart-icon"></i>
                <button class="btn-buy">COMPRAR</button>
            </div>

        </div>
    </div>

    <!-- VOLVER -->
    <div class="back-link">
        <a href="/proyecto-eventos/index.html">VOLVER AL INICIO</a>
    </div>
</body>
</html>
