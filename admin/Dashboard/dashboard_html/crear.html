        <!-- Main content -->
    <main class="main-content flex-grow-1">
            <div class="container-fluid d-flex">
            <!-- Navbar -->

            <!-- Create Event Form -->
            <div class="container">
                <h3 class="text-white text-center mb-4">Crear un Nuevo Evento</h3>
                <form action="#" method="POST">
                    <!-- Event Title -->
                    <div class="form-group">
                        <label for="eventTitle" class="text-white">TITULO DEL EVENTO</label>
                        <input type="text" class="form-control" id="eventTitle" placeholder="Nombre del evento">
                    </div>

                    <!-- Event Description -->
                    <div class="form-group">
                        <label for="eventDescription" class="text-white">DESCRIPCION DEL EVENTO</label>
                        <textarea class="form-control" id="eventDescription" rows="3" placeholder="Escribe un poco sobre tu evento..."></textarea>
                    </div>

                    <!-- Event Date -->
                    <div class="form-group">
                        <label for="eventDate" class="text-white">FECHA</label>
                        <input type="date" class="form-control" id="eventDate">
                    </div>

                    <!-- Event Image -->
                    <div class="form-group">
                        <label for="eventImage" class="text-white">IMAGEN DEL EVENTO</label>
                        <input type="file" class="form-control-file" id="eventImage">
                        <p class="text-white mt-2">Click to upload or drag and drop (SVG, PNG, JPG, or GIF max. 5MB).</p>
                        <div class="text-center mt-3">
                            <img src="/proyecto-eventos/img/img_eventos/pizza.png" alt="Event Image" id="eventImagePreview" class="img-thumbnail" width="150">
                            <button type="button" class="btn btn-danger mt-2" id="deleteImageBtn">DELETE</button>
                        </div>
                    </div>

                    <!-- Event Categories -->
                    <div class="form-group">
                        <label for="eventCategory" class="text-white">CATEGORIAS DEL EVENTO</label>
                        <select class="form-control" id="eventCategory">
                            <option>Selecciona la categoría</option>
                            <option>Conferencia</option>
                            <option>Seminario</option>
                            <option>Festival</option>
                        </select>
                    </div>

                    <!-- Save Event Button -->
                    <button type="submit" class="btn btn-success btn-block">GUARDAR EVENTO</button>
                </form>
            </div>
        </div>
    </main>
