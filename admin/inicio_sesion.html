<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login FoodMaster</title>
    <link rel="stylesheet" href="/proyecto-eventos/admin/css_admin/inicio_sesion.css">
</head>
<body>
<div class="login-container">
    <div class="form-area">
        <h1>INICIA SESION YA!</h1>
        <p>INGRESA TUS CREDENCIALES Y INICIA SESION</p>
        <button type="GOOGLE">LOG IN WITH GOOGLE</button>
        <button type="FACEBOOK">LOG IN WITH FACEBOOK</button>
        <button type="APLLE">LOG IN WITH APPLE</button>
        <h3>O INICIA SESION CON:</h3>
        <form class="login-form">
            <label for="email">Correo Electronico:</label>
            <input type="email" id="email" class="input-field" placeholder="administrador@gmail.com">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" class="input-field" placeholder="*********">
            <div class="remember-me">
                    <label for="checkbox-recuerdame">
                        <input type="checkbox" id="checkbox-recuerdame">
                        Recuérdame
                    </label>
                </div>
            <button type="submit" class="submit-button">
                Iniciar Sesion
            </button>
        </form>
        <p>NO TIENES CUENTA? <a href="" class="REGISTER">REGISTRATE YA!</a></p>
    </div>
    <a href="/index.html"><img src="/img/logos/logo_FoodMaster.png" alt="" class="logo-foodmaster"></a>
</div>
</body>
</html>
